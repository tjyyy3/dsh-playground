name: Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a PR cancels that PR's outdated run. Pushes to main use the commit SHA,
# so main runs are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    # The suite finishes in under a minute; fail a hung run instead of holding it for 6 hours.
    timeout-minutes: 10
    strategy:
      # Let every combination finish so a failure shows which OS or Node version broke.
      fail-fast: false
      matrix:
        # DSH desktop ships for Windows and macOS only. Node 24 is the same major version
        # DSH bundles (24.21.0), though runners may use a newer 24.x patch; Node 26 is the
        # current LTS and surfaces breakage before DSH upgrades.
        os: [windows-latest, macos-latest]
        node: [24, 26]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # Offline suite only: scripts/smoke.mjs reaches the live platform and is not run here.
      - run: npm test
